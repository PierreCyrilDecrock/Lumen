<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#02030A" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Lumen · Démo du rendu</title>
    <link
      rel="preload"
      href="/fonts/space-grotesk-latin-wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body class="app">
    <header class="app-header">
      <a class="app-brand app-link" href="../">← Lumen</a>
      <h1>Le Zigzag</h1>
      <div class="app-actions">
        <button
          id="undo"
          class="icon-button"
          type="button"
          aria-label="Annuler"
          title="Annuler (Ctrl+Z)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 14 4 9l5-5" />
            <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" />
          </svg>
        </button>
        <button
          id="redo"
          class="icon-button"
          type="button"
          aria-label="Rétablir"
          title="Rétablir (Ctrl+Maj+Z)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m15 14 5-5-5-5" />
            <path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13" />
          </svg>
        </button>
      </div>
    </header>
    <main class="app-stage">
      <canvas id="game" class="game-canvas" role="img" aria-label="Niveau Le Zigzag"></canvas>
    </main>
    <form class="app-panel" aria-label="Réglages du rendu">
      <label class="slider">
        <span class="slider-label">Faisceau</span>
        <input id="beam" type="range" min="0" max="100" step="1" />
        <output for="beam" id="beam-value"></output>
      </label>
      <label class="slider">
        <span class="slider-label">Impacts</span>
        <input id="impact" type="range" min="0" max="100" step="1" />
        <output for="impact" id="impact-value"></output>
      </label>
      <label class="toggle">
        <input id="motion" type="checkbox" />
        <span>Réduire les animations</span>
      </label>
    </form>
    <noscript>Lumen a besoin de JavaScript pour fonctionner.</noscript>
    <script type="module" src="/src/demo.ts"></script>
  </body>
</html>
