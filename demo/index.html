<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#02030A" />
    <meta name="color-scheme" content="dark" />
    <title>Lumen · Démo du rendu</title>
    <link
      rel="preload"
      href="/fonts/space-grotesk-latin-wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body class="demo">
    <header class="demo-header">
      <a class="demo-back" href="../">← Lumen</a>
      <h1>Le Zigzag</h1>
      <span class="demo-hint">D : temps de frame</span>
    </header>
    <div class="demo-stage">
      <canvas id="game" class="game-canvas" role="img" aria-label="Niveau Le Zigzag"></canvas>
    </div>
    <form class="demo-panel" aria-label="Réglages du rendu">
      <label class="slider">
        <span class="slider-label">Faisceau</span>
        <input id="beam" type="range" min="0" max="100" step="1" />
        <output for="beam" id="beam-value"></output>
      </label>
      <label class="slider">
        <span class="slider-label">Impacts</span>
        <input id="impact" type="range" min="0" max="100" step="1" />
        <output for="impact" id="impact-value"></output>
      </label>
      <label class="toggle">
        <input id="motion" type="checkbox" />
        <span>Réduire les animations</span>
      </label>
    </form>
    <noscript>Lumen a besoin de JavaScript pour fonctionner.</noscript>
    <script type="module" src="/src/demo.ts"></script>
  </body>
</html>
