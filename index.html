<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#02030A" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Lumen, un jeu de puzzle sur la lumière." />
    <title>Lumen</title>
    <link
      rel="preload"
      href="/fonts/space-grotesk-latin-wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body class="app">
    <header class="app-header">
      <span class="app-brand">Lumen</span>
      <h1>Le Zigzag</h1>
      <div class="app-actions">
        <button
          id="undo"
          class="icon-button"
          type="button"
          aria-label="Annuler"
          title="Annuler (Ctrl+Z)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 14 4 9l5-5" />
            <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" />
          </svg>
        </button>
        <button
          id="redo"
          class="icon-button"
          type="button"
          aria-label="Rétablir"
          title="Rétablir (Ctrl+Maj+Z)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m15 14 5-5-5-5" />
            <path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13" />
          </svg>
        </button>
      </div>
    </header>
    <main class="app-stage">
      <canvas
        id="game"
        class="game-canvas"
        role="img"
        aria-label="Plateau : tournez et déplacez les miroirs pour guider la lumière jusqu'à la cible"
      ></canvas>
    </main>
    <noscript>Lumen a besoin de JavaScript pour fonctionner.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
