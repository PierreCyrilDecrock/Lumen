<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#02030A" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Lumen, un jeu de puzzle sur la lumière." />
    <title>Lumen</title>
    <link
      rel="preload"
      href="/fonts/space-grotesk-latin-wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body class="app">
    <section id="screen-menu" class="screen screen-menu" hidden>
      <div class="menu">
        <h1 class="menu-title" tabindex="-1">Lumen</h1>
        <p class="menu-tagline">Guidez la lumière jusqu'à sa cible.</p>
        <div class="menu-actions">
          <button id="menu-play" class="button button-primary" type="button">Jouer</button>
          <button id="menu-levels" class="button" type="button">Niveaux</button>
          <button id="menu-settings" class="button" type="button">Réglages</button>
        </div>
      </div>
    </section>

    <section id="screen-levels" class="screen" hidden>
      <header class="app-header">
        <button
          class="icon-button"
          type="button"
          data-back
          data-icon="back"
          aria-label="Retour au menu"
        ></button>
        <h1 tabindex="-1">Niveaux</h1>
        <span></span>
      </header>
      <div id="level-chapters" class="level-chapters"></div>
    </section>

    <section id="screen-settings" class="screen" hidden>
      <header class="app-header">
        <button
          class="icon-button"
          type="button"
          data-back
          data-icon="back"
          aria-label="Retour au menu"
        ></button>
        <h1 tabindex="-1">Réglages</h1>
        <span></span>
      </header>
      <div class="settings">
        <div class="settings-preview">
          <canvas
            id="settings-preview"
            class="game-canvas"
            role="img"
            aria-label="Aperçu : un faisceau, un miroir et une cible avec les réglages actuels"
          ></canvas>
        </div>
        <div class="presets" role="group" aria-label="Préréglages">
          <button class="preset" type="button" data-preset="doux" aria-pressed="false">Doux</button>
          <button class="preset" type="button" data-preset="normal" aria-pressed="false">
            Normal
          </button>
          <button class="preset" type="button" data-preset="intense" aria-pressed="false">
            Intense
          </button>
        </div>
        <label class="slider">
          <span class="slider-label">Faisceau</span>
          <input id="set-beam" type="range" min="0" max="100" step="5" />
          <output id="set-beam-value" for="set-beam"></output>
        </label>
        <label class="slider">
          <span class="slider-label">Impacts</span>
          <input id="set-impact" type="range" min="0" max="100" step="5" />
          <output id="set-impact-value" for="set-impact"></output>
        </label>
        <label class="toggle">
          <input id="set-motion" type="checkbox" role="switch" />
          <span>Réduire les animations</span>
        </label>
        <p class="settings-note">
          Le cœur du faisceau reste toujours net et continu, quels que soient ces réglages.
        </p>
      </div>
    </section>

    <section id="screen-play" class="screen" hidden>
      <header class="app-header">
        <button
          class="icon-button"
          type="button"
          data-back
          data-icon="back"
          aria-label="Retour aux niveaux"
        ></button>
        <h1 id="play-title" tabindex="-1"></h1>
        <div class="app-actions">
          <button
            id="play-pause"
            class="icon-button"
            type="button"
            data-icon="pause"
            aria-label="Pause"
            title="Pause (Échap)"
          ></button>
        </div>
      </header>
      <div class="hud-bar">
        <div class="hud-stats">
          <span class="hud-counter"><strong id="play-rotations">0</strong> rotations</span>
          <span id="play-stars" class="hud-stars" role="img"></span>
          <span id="play-crystals" class="hud-counter" hidden
            >Cristaux <strong id="play-crystals-lit">0</strong>/<span id="play-crystals-total"
              >0</span
            ></span
          >
        </div>
        <div class="app-actions">
          <button
            id="play-store"
            class="icon-button"
            type="button"
            data-icon="tray"
            aria-label="Remettre le bloc au bac"
            title="Remettre au bac"
            hidden
          ></button>
          <button
            id="play-hint"
            class="icon-button"
            type="button"
            data-icon="hint"
            aria-label="Indice"
            title="Indice (H)"
          ></button>
          <button
            id="undo"
            class="icon-button"
            type="button"
            data-icon="undo"
            aria-label="Annuler"
            title="Annuler (Ctrl+Z)"
          ></button>
          <button
            id="redo"
            class="icon-button"
            type="button"
            data-icon="redo"
            aria-label="Rétablir"
            title="Rétablir (Ctrl+Maj+Z)"
          ></button>
        </div>
      </div>
      <label id="play-frost" class="hud-frost" hidden>
        <span>Dépoli du verre</span>
        <input id="play-frost-input" type="range" min="20" max="90" step="5" />
        <output id="play-frost-value" for="play-frost-input"></output>
      </label>
      <p id="play-optics" class="hud-optics" aria-live="polite" hidden></p>
      <div
        id="play-colors"
        class="hud-colors"
        role="list"
        aria-label="Couleurs captées"
        hidden
      ></div>
      <main class="app-stage">
        <canvas
          id="game"
          class="game-canvas"
          role="img"
          aria-label="Plateau : tournez et déplacez les miroirs pour guider la lumière jusqu'aux cibles"
        ></canvas>
      </main>
      <div id="tray" class="tray" role="group" aria-label="Bac de matières" hidden></div>
      <p id="play-message" class="sr-only" aria-live="polite"></p>

      <div id="pause" class="overlay" hidden>
        <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="pause-title">
          <h2 id="pause-title">Pause</h2>
          <div class="dialog-actions">
            <button id="pause-resume" class="button button-primary" type="button">Reprendre</button>
            <button id="pause-restart" class="button" type="button">Recommencer</button>
            <button id="pause-levels" class="button" type="button">Niveaux</button>
            <button id="pause-menu" class="button" type="button">Menu principal</button>
          </div>
        </div>
      </div>

      <div id="victory" class="overlay" hidden>
        <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="victory-title">
          <h2 id="victory-title">Lumière !</h2>
          <div id="victory-stars" class="victory-stars" role="img"></div>
          <p id="victory-detail" class="dialog-detail"></p>
          <div class="dialog-actions">
            <button id="victory-next" class="button button-primary" type="button">Suivant</button>
            <button id="victory-replay" class="button" type="button">Rejouer</button>
            <button id="victory-levels" class="button" type="button">Niveaux</button>
          </div>
        </div>
      </div>
    </section>
    <noscript>Lumen a besoin de JavaScript pour fonctionner.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
